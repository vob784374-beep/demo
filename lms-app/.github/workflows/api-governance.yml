name: API Governance

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/app/**'
      - 'backend/openapi/**'
      - 'backend/requirements/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/app/**'
      - 'backend/openapi/**'
      - 'backend/requirements/**'

jobs:
  # ── Job 1: OpenAPI spec is syntax-valid ────────────────────────────────────
  validate-spec:
    name: Validate OpenAPI spec
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements/dev.txt

      - name: Validate spec syntax (openapi-spec-validator)
        run: python scripts/validate_spec.py

  # ── Job 2: Committed spec matches code ─────────────────────────────────────
  spec-drift:
    name: Detect spec drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # Minimal SQLite is enough for spec generation
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Check spec is up-to-date
        env:
          APP_ENV: development
          DATABASE_URL: sqlite:////:memory:
          JWT_SECRET_KEY: ci-jwt-secret-32-bytes-or-longer
          SECRET_KEY: ci-secret-key-for-testing-only
        run: python scripts/check_spec_drift.py

  # ── Job 3: All tests pass (including envelope validator) ───────────────────
  test:
    name: Tests + envelope validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements/dev.txt

      - name: Run test suite
        env:
          APP_ENV: testing
          SECRET_KEY: ci-secret-key-for-testing-only
          JWT_SECRET_KEY: ci-jwt-secret-32-bytes-or-longer
        run: python -m pytest tests/ -q --tb=short

  # ── Job 4: Contract tests with schemathesis (against live app) ─────────────
  contract-tests:
    name: Schemathesis contract tests
    runs-on: ubuntu-latest
    needs: [validate-spec, spec-drift]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements/dev.txt

      - name: Start app in background
        env:
          APP_ENV: development
          DATABASE_URL: sqlite:////:memory:
          JWT_SECRET_KEY: ci-jwt-secret-32-bytes-or-longer
          SECRET_KEY: ci-secret-key-for-testing-only
          RATELIMIT_STORAGE_URI: memory://
        run: |
          python -c "
          from app import create_app
          app = create_app('development')
          with app.app_context():
              from app.extensions import db
              db.create_all()
          app.run(port=5000)
          " &
          sleep 3  # wait for startup

      - name: Run schemathesis contract tests
        run: |
          schemathesis run http://localhost:5000/api/openapi.json \
            --checks=not_a_server_error \
            --max-response-time=2000 \
            --hypothesis-max-examples=25 \
            --base-url=http://localhost:5000
